name: CIQUAL probe (temporary)
on:
  push:
    branches: [claude/logbook-fitness-app-rfgnlw]
    paths: ['.github/workflows/ciqual-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find CIQUAL on data.gouv.fr
        run: |
          curl -sS "https://www.data.gouv.fr/api/1/datasets/?q=ciqual&page_size=10" \
            | jq -r '.data[] | "DATASET \(.id) | \(.slug) | \(.title) | org=\(.organization.name // "-")", (.resources[] | "  RES \(.format) | \(.title) | \(.url)")'
      - name: ANSES site
        run: |
          curl -sSL -m 30 -o page.html -w "%{http_code}\n" https://ciqual.anses.fr/ || true
          grep -oiE 'href="[^"]+\.(xml|zip|xls|xlsx|csv)[^"]*"' page.html | head -40 || true
          curl -sSL -m 30 -o dl.html -w "%{http_code}\n" "https://ciqual.anses.fr/#/cms/download/node/20" || true
