<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projets & Chantiers — Montpellier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0f0f12;
    --surface: #16161c;
    --border: #2a2a35;
    --accent: #e8d44d;
    --accent2: #5bc4a0;
    --accent3: #e06a6a;
    --text: #e8e8ee;
    --muted: #7a7a90;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-display); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 20px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 1000;
  }
  header h1 { font-size: 15px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  header span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .badge { background: var(--accent); color: #000; font-family: var(--font-mono); font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 2px; }

  .layout { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar */
  #sidebar {
    width: 320px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .search-box {
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }
  .search-box input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font-mono); font-size: 12px;
    padding: 8px 12px; border-radius: 4px; outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--muted); }

  .filters {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .filter-btn {
    font-family: var(--font-mono); font-size: 10px;
    padding: 3px 9px; border-radius: 2px;
    border: 1px solid var(--border);
    background: transparent; color: var(--muted);
    cursor: pointer; transition: all 0.15s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--accent); color: #000; border-color: var(--accent);
  }

  #project-list {
    flex: 1; overflow-y: auto;
    padding: 8px;
  }
  #project-list::-webkit-scrollbar { width: 4px; }
  #project-list::-webkit-scrollbar-track { background: transparent; }
  #project-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .project-item {
    padding: 10px 12px; border-radius: 4px;
    border: 1px solid transparent;
    cursor: pointer; margin-bottom: 4px;
    transition: all 0.15s;
  }
  .project-item:hover { background: rgba(232,212,77,0.06); border-color: var(--border); }
  .project-item.active { background: rgba(232,212,77,0.1); border-color: var(--accent); }
  .project-item .pname { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.4; }
  .project-item .pmeta { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .pmeta .tag { background: var(--bg); border: 1px solid var(--border); padding: 1px 5px; border-radius: 2px; }
  .pmeta .tag.serm { border-color: #5bc4a0; color: #5bc4a0; }
  .pmeta .tag.sa3m { border-color: #7b8fff; color: #7b8fff; }

  .count-label { font-family: var(--font-mono); font-size: 10px; color: var(--muted); padding: 8px 12px 4px; }

  /* Map */
  #map { flex: 1; }

  /* Detail panel */
  #detail-panel {
    position: absolute; bottom: 24px; right: 24px;
    width: 300px;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 16px;
    z-index: 2000;
    display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  #detail-panel.visible { display: block; animation: slideup 0.2s ease; }
  @keyframes slideup { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  #detail-panel .close-btn {
    position: absolute; top: 10px; right: 12px;
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px;
  }
  #detail-panel h3 { font-size: 14px; font-weight: 700; color: var(--accent); line-height: 1.4; padding-right: 20px; }
  #detail-panel .detail-row { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 8px; }
  #detail-panel .detail-row span { color: var(--text); }

  /* Leaflet overrides */
  .leaflet-popup-content-wrapper { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; color: var(--text); box-shadow: none; }
  .leaflet-popup-tip { background: var(--border); }
  .leaflet-popup-content { font-family: var(--font-display); font-size: 12px; margin: 10px 14px; }
  .leaflet-popup-content strong { color: var(--accent); }
  .leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-color: var(--border) !important; }

  .no-results { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: center; padding: 30px 20px; }
</style>
</head>

<header>

    <div id="project-list"></div>
  </div>

<div id="detail-panel">

const DT_COLORS = {
  "DT Port Marianne et Ouest": "#e8d44d",
  "MISSION COMMUNES": "#5bc4a0",
  "Mission Communes": "#5bc4a0",
  "D3C": "#e06a6a",
  "DT CAMBACERES - ODE à la MER": "#7b8fff",
  "DT Ouest": "#f5a623",
  "DT Restanque": "#c4a0e8",
  "DT Grand Cœur": "#ff8c5a",
  "DT Med Vallée": "#4dd0e8",
  "DT Mosson Cévennes": "#a0d86a",
  "ENERGIE / RMCF": "#e87bcd",
};

function getColor(dt) {
  return DT_COLORS[dt] || "#aaaaaa";
}

function makeSVGMarker(color) {
  return L.divIcon({
    className: '',
    html: `<svg width="20" height="26" viewBox="0 0 20 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 0C4.477 0 0 4.477 0 10C0 17.5 10 26 10 26C10 26 20 17.5 20 10C20 4.477 15.523 0 10 0Z" fill="${color}"/>
      <circle cx="10" cy="10" r="4" fill="#0f0f12"/>
    </svg>`,
    iconSize: [20, 26], iconAnchor: [10, 26], popupAnchor: [0, -26]
  });
}

// Init map
const map = L.map('map', { zoomControl: true }).setView([43.610, 3.877], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap contributors © CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// Add markers
const markers = {};
PROJECTS.forEach(p => {
  const m = L.marker([p.lat, p.lng], { icon: makeSVGMarker(getColor(p.dt)) }).addTo(map);
  m.bindPopup(`<strong>${p.name}</strong><br><span style="color:#aaa;font-family:'DM Mono',monospace;font-size:11px">${p.dt} · ${p.soc} · Nº${p.nope}</span>`);
  m.on('click', () => showDetail(p));
  markers[p.id] = m;
});

// UI
const uniqueDTs = [...new Set(PROJECTS.map(p => p.dt))].sort();
const filtersEl = document.getElementById('dt-filters');
uniqueDTs.forEach(dt => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.dt = dt;
  btn.textContent = dt;
  btn.style.borderColor = getColor(dt);
  filtersEl.appendChild(btn);
});

let activeDT = 'all';
let searchVal = '';

function normalizeStr(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function renderList() {
  const list = document.getElementById('project-list');
  const filtered = PROJECTS.filter(p => {
    const dtMatch = activeDT === 'all' || p.dt === activeDT;
    const q = normalizeStr(searchVal);
    const textMatch = !q || normalizeStr(p.name).includes(q) || normalizeStr(p.ville).includes(q) || normalizeStr(p.nope).includes(q) || normalizeStr(p.dt).includes(q);
    return dtMatch && textMatch;
  });

  // Update markers visibility
  PROJECTS.forEach(p => {
    const show = filtered.find(f => f.id === p.id);
    if (show) { if (!map.hasLayer(markers[p.id])) markers[p.id].addTo(map); }
    else { if (map.hasLayer(markers[p.id])) markers[p.id].remove(); }
  });

  document.getElementById('visible-count').textContent = filtered.length + ' projet' + (filtered.length !== 1 ? 's' : '');
  document.getElementById('list-count').textContent = filtered.length + ' résultats';

  list.innerHTML = '';
  filtered.forEach(p => {
    const item = document.createElement('div');
    item.className = 'project-item';
    item.dataset.id = p.id;
    const socClass = p.soc === 'SERM' || p.soc === 'SermID' || p.soc === 'SERM.ID' ? 'serm' : p.soc === 'SA3M' ? 'sa3m' : '';
    item.innerHTML = `
      <div class="pname">${p.name}</div>
      <div class="pmeta">
        <span class="tag" style="border-color:${getColor(p.dt)};color:${getColor(p.dt)}">${p.dt}</span>
        ${p.soc && p.soc !== '—' ? `<span class="tag ${socClass}">${p.soc}</span>` : ''}
        ${p.ville ? `<span class="tag">${p.ville}</span>` : ''}
      </div>`;
    item.addEventListener('click', () => {
      document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
      map.setView([p.lat, p.lng], 15, {animate: true});
      markers[p.id].openPopup();
      showDetail(p);
    });
    list.appendChild(item);
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeDT = btn.dataset.dt;
    renderList();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchVal = e.target.value;
  renderList();
});

function showDetail(p) {
  document.getElementById('dp-name').textContent = p.name;
  document.getElementById('dp-nope').textContent = p.nope;
  document.getElementById('dp-dt').textContent = p.dt;
  document.getElementById('dp-dir').textContent = p.dir || '—';
  document.getElementById('dp-soc').textContent = p.soc;
  document.getElementById('dp-ville').textContent = p.ville || '—';
  document.getElementById('dp-resp').textContent = p.resp || '—';
  document.getElementById('detail-panel').classList.add('visible');
}

function closeDetail() { document.getElementById('detail-panel').classList.remove('visible'); }

renderList();
</script>
